name: Publicar Chispa (firma permanente)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CHISPA_KEYSTORE_B64: ${{ secrets.CHISPA_KEYSTORE_B64 }}
      CHISPA_STORE_PASSWORD: ${{ secrets.CHISPA_STORE_PASSWORD }}
      CHISPA_KEY_ALIAS: ${{ secrets.CHISPA_KEY_ALIAS }}
      CHISPA_KEY_PASSWORD: ${{ secrets.CHISPA_KEY_PASSWORD }}
      CHISPA_CERT_SHA256: ${{ secrets.CHISPA_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar firma permanente
        shell: bash
        run: |
          set -euo pipefail
          for var in CHISPA_KEYSTORE_B64 CHISPA_STORE_PASSWORD CHISPA_KEY_ALIAS CHISPA_KEY_PASSWORD CHISPA_CERT_SHA256; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Falta el secreto $var. No publicaré un APK con firma efímera."
              exit 1
            fi
          done
          echo "$CHISPA_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/chispa-release.jks"
          chmod 600 "$RUNNER_TEMP/chispa-release.jks"
          echo "CHISPA_KEYSTORE_FILE=$RUNNER_TEMP/chispa-release.jks" >> "$GITHUB_ENV"
      - name: Obtener llama.cpp
        shell: bash
        run: |
          mkdir -p third_party
          git clone -q https://github.com/ggml-org/llama.cpp third_party/llama.cpp
          git -C third_party/llama.cpp checkout -q 10b8b7553494f3638da7668cf17cac089229122a
          python3 - <<'PY'
          from pathlib import Path
          p = Path("third_party/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp")
          txt = p.read_text()
          assert "DEFAULT_CONTEXT_SIZE    = 8192" in txt
          assert "stop_generation_position = current_position + user_prompt_size + n_predict;" in txt
          txt = txt.replace("DEFAULT_CONTEXT_SIZE    = 8192", "DEFAULT_CONTEXT_SIZE    = 6144")
          txt = txt.replace("stop_generation_position = current_position + user_prompt_size + n_predict;",
                            "stop_generation_position = current_position + n_predict;")
          p.write_text(txt)
          g = Path("third_party/llama.cpp/examples/llama.android/lib/build.gradle.kts")
          t = g.read_text()
          for a,b in [("-DGGML_CPU_ALL_VARIANTS=ON","-DGGML_CPU_ALL_VARIANTS=OFF"),
                      ("-DGGML_BACKEND_DL=ON","-DGGML_BACKEND_DL=OFF"),
                      ("-DCMAKE_VERBOSE_MAKEFILE=ON","-DCMAKE_VERBOSE_MAKEFILE=OFF"),
                      ("-DCMAKE_MESSAGE_LOG_LEVEL=DEBUG","-DCMAKE_MESSAGE_LOG_LEVEL=STATUS")]:
            assert a in t
            t=t.replace(a,b)
          g.write_text(t)
          p=Path("third_party/llama.cpp/examples/llama.android/lib/src/main/cpp/CMakeLists.txt")
          t=p.read_text().replace("set(GGML_CPU_KLEIDIAI ON)","set(GGML_CPU_KLEIDIAI OFF)")
          t=t.replace("set(GGML_OPENMP ON)","set(GGML_OPENMP OFF)")
          p.write_text(t)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar compilador Android
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDK_MANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compilar RELEASE firmado
        run: gradle :app:assembleRelease --no-daemon --max-workers=4 --stacktrace
      - name: Validar certificado y APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          TOOL="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$TOOL" verify --verbose "$APK" > /dev/null
          ACTUAL="$("$TOOL" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr 'A-F' 'a-f' | tr -d ':')"
          EXPECTED="$(printf '%s' "$CHISPA_CERT_SHA256" | tr 'A-F' 'a-f' | tr -d ':')"
          test -n "$ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Huella del certificado distinta a la firma permanente. APK bloqueado."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ChispaLocal-v0.4-ACTUALIZABLE-FIRMADO
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Limpiar clave
        if: always()
        run: rm -f "$RUNNER_TEMP/chispa-release.jks"
