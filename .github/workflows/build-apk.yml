name: Compilar Chispa Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chispa-android-build
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Obtener motor oficial llama.cpp
        shell: bash
        run: |
          mkdir -p third_party
          git clone -q https://github.com/ggml-org/llama.cpp third_party/llama.cpp
          git -C third_party/llama.cpp checkout -q 10b8b7553494f3638da7668cf17cac089229122a
          python3 - <<'PY'
          from pathlib import Path
          p = Path("third_party/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp")
          txt = p.read_text()
          old = "DEFAULT_CONTEXT_SIZE    = 8192"
          assert old in txt, "El API nativo cambió: revisar versión"
          assert "stop_generation_position = current_position + user_prompt_size + n_predict;" in txt, "Límite de generación modificado por upstream"
          txt = txt.replace(old, "DEFAULT_CONTEXT_SIZE    = 6144")
          txt = txt.replace("stop_generation_position = current_position + user_prompt_size + n_predict;", "stop_generation_position = current_position + n_predict;")
          p.write_text(txt)
          lib_gradle = Path("third_party/llama.cpp/examples/llama.android/lib/build.gradle.kts")
          config = lib_gradle.read_text()
          for before, after in [
              ("-DGGML_CPU_ALL_VARIANTS=ON", "-DGGML_CPU_ALL_VARIANTS=OFF"),
              ("-DGGML_BACKEND_DL=ON", "-DGGML_BACKEND_DL=OFF"),
              ("-DCMAKE_VERBOSE_MAKEFILE=ON", "-DCMAKE_VERBOSE_MAKEFILE=OFF"),
              ("-DCMAKE_MESSAGE_LOG_LEVEL=DEBUG", "-DCMAKE_MESSAGE_LOG_LEVEL=STATUS"),
          ]:
              assert before in config, "Cambio upstream: " + before
              config = config.replace(before, after)
          lib_gradle.write_text(config)
          native_cmake = Path("third_party/llama.cpp/examples/llama.android/lib/src/main/cpp/CMakeLists.txt")
          native_cfg = native_cmake.read_text()
          for before, after in [
              ("set(GGML_CPU_KLEIDIAI ON)", "set(GGML_CPU_KLEIDIAI OFF)"),
              ("set(GGML_OPENMP ON)", "set(GGML_OPENMP OFF)"),
          ]:
              assert before in native_cfg, "Cambio upstream: " + before
              native_cfg = native_cfg.replace(before, after)
          native_cmake.write_text(native_cfg)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar SDK, NDK y CMake
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_HOME"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compilar APK ARM64 con IA local
        run: gradle :app:assembleDebug --no-daemon --max-workers=4 --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ChispaLocal-v0.3-AnalisisLargo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
